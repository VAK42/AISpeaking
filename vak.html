<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nobunaga Speaking</title>
  <link rel="stylesheet" href="vak.css">
</head>
<body>
  <div id="appContainer">
    <header id="mainHeader">
      <div id="headerLeft">
        <h1 id="appTitle">Nobunaga Speaking</h1>
        <p id="appSubtitle">Interactive English & Japanese Conversation Practice</p>
      </div>
      <div id="headerRight">
        <div id="languageBox">
          <select id="languageSelect">
            <option value="English">English</option>
            <option value="Japanese">Japanese</option>
          </select>
        </div>
        <button id="clearChatButton" class="actionBtn">Clear</button>
      </div>
    </header>
    <section id="statusSection">
      <div id="statusIndicator">
        <span id="statusLabel">Status:</span>
        <span id="statusValue">Ready For Speaking</span>
      </div>
      <div id="waveVisualizer" class="waveHidden">
        <div class="waveBar waveBarOne"></div>
        <div class="waveBar waveBarTwo"></div>
        <div class="waveBar waveBarThree"></div>
        <div class="waveBar waveBarFour"></div>
        <div class="waveBar waveBarFive"></div>
      </div>
    </section>
    <main id="chatStream"></main>
    <footer id="inputFooter">
      <div id="inputBar">
        <button id="voiceButton" class="iconBtn" title="Voice Input">
          <svg class="lucideIcon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" x2="12" y1="19" y2="22"></line>
          </svg>
        </button>
        <input type="text" id="textInput" placeholder="Type Your Message Here">
        <button id="sendButton" class="iconBtn" title="Send Message">
          <svg class="lucideIcon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
    <audio id="tutorAudioPlayer"></audio>
  </div>
  <script src="vak.js"></script>
</body>
</html>
